name: reusable-ci

"on":
  workflow_call:
    inputs:
      test-command:
        description: "Command to execute for unit testing (e.g. 'bun test', 'pnpm test')"
        type: string
        required: false
        default: ""
      test-runtime:
        description: "Runtime to setup before running test-command ('bun', 'node', 'none')"
        type: string
        required: false
        default: "bun"
      docker-context:
        description: "Docker build context directory"
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to Dockerfile relative to context"
        type: string
        required: false
        default: "Dockerfile"
      image-name:
        description: "Target image name in GHCR (e.g. 'ghcr.io/es6kr/clawo-webhook')"
        type: string
        required: true
      push-image:
        description: "Force push image regardless of event name"
        type: boolean
        required: false
        default: false
      runner-label:
        description: "Target self-hosted runner label"
        type: string
        required: false
        default: "es6kr-local-linux"
      timeout-minutes:
        description: "Timeout in minutes for test and build jobs"
        type: number
        required: false
        default: 15
    secrets:
      ghcr-token:
        description: "GitHub token for authenticating to GHCR (defaults to caller GITHUB_TOKEN)"
        required: false

jobs:
  test:
    if: inputs.test-command != ''
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:local-linux'))) && inputs.runner-label || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate self-hosted runner route before checkout
        env:
          HAS_CI_LOCAL_LINUX: ${{ contains(github.event.pull_request.labels.*.name, 'ci:local-linux') }}
          HAS_CONFLICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:dev36') || contains(github.event.pull_request.labels.*.name, 'ci:dev-36') || contains(github.event.pull_request.labels.*.name, 'ci:ai') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_CI_LOCAL_LINUX" = "true" ]; then
            if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HAS_CONFLICT" = "true" ]; then
              echo "Invalid self-hosted route: trusted same-repository PR and exclusive selector required." >&2
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - name: Setup Bun
        if: inputs.test-runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        if: inputs.test-runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run test command
        run: ${{ inputs.test-command }}

  build-and-push:
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.test-command == '')
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:local-linux'))) && inputs.runner-label || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate self-hosted runner route before checkout
        env:
          HAS_CI_LOCAL_LINUX: ${{ contains(github.event.pull_request.labels.*.name, 'ci:local-linux') }}
          HAS_CONFLICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:dev36') || contains(github.event.pull_request.labels.*.name, 'ci:dev-36') || contains(github.event.pull_request.labels.*.name, 'ci:ai') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_CI_LOCAL_LINUX" = "true" ]; then
            if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HAS_CONFLICT" = "true" ]; then
              echo "Invalid self-hosted route: trusted same-repository PR and exclusive selector required." >&2
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.push-image || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=0.1.0,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-context }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push-image || github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
