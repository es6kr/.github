name: reusable-ci

"on":
  workflow_call:
    inputs:
      test-command:
        description: "Command to execute for unit testing (e.g. 'bun test', 'pnpm test')"
        type: string
        required: false
        default: ""
      test-runtime:
        description: "Runtime to setup before running test-command ('bun', 'node', 'none')"
        type: string
        required: false
        default: "bun"
      docker-context:
        description: "Docker build context directory"
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to Dockerfile relative to context"
        type: string
        required: false
        default: "Dockerfile"
      platforms:
        description: "Optional Buildx target platforms; empty keeps the existing native default"
        type: string
        required: false
        default: ""
      oci-artifact-name:
        description: "Opt-in PR-only OCI archive prefix; empty preserves existing exports"
        type: string
        required: false
        default: ""
      image-name:
        description: "Target image name in GHCR (e.g. 'ghcr.io/es6kr/clawo-webhook')"
        type: string
        required: true
      push-image:
        description: "Force push image regardless of event name"
        type: boolean
        required: false
        default: false
      runner-label:
        description: "Target self-hosted runner label"
        type: string
        required: false
        default: "es6kr-local-linux"
      timeout-minutes:
        description: "Timeout in minutes for test and build jobs"
        type: number
        required: false
        default: 15
    outputs:
      image-digest:
        description: "Buildx digest output, not independent registry acceptance"
        value: ${{ jobs.build-and-push.outputs.image-digest }}
      image-id:
        description: "Buildx local image identifier, distinct from a registry subject"
        value: ${{ jobs.build-and-push.outputs.image-id }}
    secrets:
      ghcr-token:
        description: "GitHub token for authenticating to GHCR (defaults to caller GITHUB_TOKEN)"
        required: false

jobs:
  test:
    if: inputs.test-command != ''
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:local-linux'))) && inputs.runner-label || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate self-hosted runner route before checkout
        env:
          HAS_CI_LOCAL_LINUX: ${{ contains(github.event.pull_request.labels.*.name, 'ci:local-linux') }}
          HAS_CONFLICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:dev36') || contains(github.event.pull_request.labels.*.name, 'ci:dev-36') || contains(github.event.pull_request.labels.*.name, 'ci:ai') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_CI_LOCAL_LINUX" = "true" ]; then
            if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HAS_CONFLICT" = "true" ]; then
              echo "Invalid self-hosted route: trusted same-repository PR and exclusive selector required." >&2
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - name: Setup Bun
        if: inputs.test-runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        if: inputs.test-runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run test command
        run: ${{ inputs.test-command }}

  build-and-push:
    needs: [test]
    if: always() && (needs.test.result == 'success' || inputs.test-command == '')
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:local-linux'))) && inputs.runner-label || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-id: ${{ steps.build.outputs.imageid }}
    steps:
      - name: Validate self-hosted runner route before checkout
        env:
          HAS_CI_LOCAL_LINUX: ${{ contains(github.event.pull_request.labels.*.name, 'ci:local-linux') }}
          HAS_CONFLICT: ${{ contains(github.event.pull_request.labels.*.name, 'ci:dev36') || contains(github.event.pull_request.labels.*.name, 'ci:dev-36') || contains(github.event.pull_request.labels.*.name, 'ci:ai') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_CI_LOCAL_LINUX" = "true" ]; then
            if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HAS_CONFLICT" = "true" ]; then
              echo "Invalid self-hosted route: trusted same-repository PR and exclusive selector required." >&2
              exit 1
            fi
          fi

      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.push-image || github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr-token || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=0.1.0,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=,format=short

      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Prepare optional OCI export
        if: inputs.oci-artifact-name != ''
        env:
          OCI_ARTIFACT_NAME: ${{ inputs.oci-artifact-name }}
          OCI_DIRECTORY: ${{ runner.temp }}/${{ inputs.oci-artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          BUILD_EVENT: ${{ github.event_name }}
          PUSH_IMAGE: ${{ inputs.push-image }}
        run: |
          set -euo pipefail
          # GUARD: untrusted names must not escape runner-owned temporary storage.
          [[ "$OCI_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$ ]]
          [[ "$BUILD_EVENT" == "pull_request" && "$PUSH_IMAGE" == "false" ]]
          umask 077
          mkdir -- "$OCI_DIRECTORY"

      - name: Build and push container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          outputs: ${{ inputs.oci-artifact-name != '' && format('type=oci,dest={0}/{1}-{2}-{3}/image.oci.tar', runner.temp, inputs.oci-artifact-name, github.run_id, github.run_attempt) || '' }}
          push: ${{ inputs.push-image || github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record build identifiers
        if: (inputs.platforms != '' || inputs.oci-artifact-name != '') && steps.build.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          OCI_ARTIFACT_NAME: ${{ inputs.oci-artifact-name }}
          OCI_DIRECTORY: ${{ runner.temp }}/${{ inputs.oci-artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ && "$BUILD_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ -z "$IMAGE_ID" || "$IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive_sha256=""
          archive_bytes=0
          if [[ -n "$OCI_ARTIFACT_NAME" ]]; then
            # GUARD: reject missing or oversized exports before uploading evidence.
            [[ -f "$OCI_DIRECTORY/image.oci.tar" && ! -L "$OCI_DIRECTORY/image.oci.tar" ]]
            archive_bytes="$(wc -c < "$OCI_DIRECTORY/image.oci.tar")"
            [[ "$archive_bytes" -gt 0 && "$archive_bytes" -le 2000000000 ]]
            archive_sha256="$(sha256sum "$OCI_DIRECTORY/image.oci.tar")"
            archive_sha256="${archive_sha256%% *}"
            [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          fi
          printf -v receipt '{"schema":1,"source_commit":"%s","run_id":"%s","run_attempt":"%s","image_id":"%s","builder_digest":"%s","archive_sha256":"%s","archive_bytes":%s,"oci_subject_kind":"unverified","registry_verified":false}' \
            "$source_commit" "$BUILD_RUN_ID" "$BUILD_RUN_ATTEMPT" "$IMAGE_ID" "$IMAGE_DIGEST" "$archive_sha256" "$archive_bytes"
          printf 'CI_BUILD_RECEIPT=%s\n' "$receipt"
          if [[ -n "$OCI_ARTIFACT_NAME" ]]; then
            printf '%s\n' "$receipt" > "$OCI_DIRECTORY/build-receipt.json"
          fi

      - name: Upload optional OCI build evidence
        if: inputs.oci-artifact-name != '' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.oci-artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ inputs.oci-artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}/image.oci.tar
            ${{ runner.temp }}/${{ inputs.oci-artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}/build-receipt.json
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 3
